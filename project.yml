name: Edgework
options:
  bundleIdPrefix: com.pizza
  deploymentTarget:
    iOS: "17.0"
targets:
  Edgework:
    type: application
    platform: iOS
    sources: [Edgework, Shared]
    dependencies:
      - target: EdgeworkWidgets
    info:
      path: Edgework/Info.plist
      properties:
        UIBackgroundModes: [location, audio]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Calendar
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.ical.ics, public.calendar-event]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pizza.edgework
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Edgework
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan food barcodes to log what you eat.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Track your route, distance and pace on GPS runs.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Keep tracking your run while the screen is locked.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_PREVIEWS: NO
  EdgeworkWidgets:
    type: app-extension
    platform: iOS
    sources: [EdgeworkWidgets, Shared]
    info:
      path: EdgeworkWidgets/Info.plist
      properties:
        CFBundleDisplayName: Edgework
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pizza.edgework.widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: NO
