name: Simulator screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "^\s+iPhone 16 Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Edgework.xcodeproj -scheme Edgework -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build build 2>&1 | tail -5
      - name: Screenshots
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Edgework.app
          ID=com.pizza.edgework
          mkdir -p shots
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4
          xcrun simctl install "$UDID" "$APP"
          shot() { name=$1; shift; xcrun simctl launch "$UDID" $ID "$@"; sleep 6; xcrun simctl io "$UDID" screenshot "shots/$name.png"; xcrun simctl terminate "$UDID" $ID || true; sleep 1; }
          shot 00-onboarding
          shot 01-onboarding-you -onboardPage you
          shot 02-onboarding-track -onboardPage track
          shot 03-onboarding-schedule -onboardPage schedule
          for t in 0 1 2 3 4; do shot "1$t-tab" -demoData YES -startTab $t; done
          shot 28-settings -demoData YES -showScreen settings
          shot 29-shots -demoData YES -showScreen shots
          shot 31-addfood -demoData YES -showScreen addfood
          shot 32-food -demoData YES -showScreen food
          shot 33-aim -demoData YES -showScreen aim
          shot 35-pucks -demoData YES -showScreen pucks
          shot 36-mealgen -demoData YES -showScreen mealgen
          shot 37-scan -demoData YES -showScreen scan
          shot 38-settings-track -demoData YES -sport track -showScreen settings
          shot 40-track-today -demoData YES -sport track -startTab 0
          shot 41-track-train -demoData YES -sport track -startTab 1
          shot 42-track-prs -demoData YES -sport track -showScreen prs
          shot 43-track-pace -demoData YES -sport track -showScreen pace
          shot 44-track-drill -demoData YES -sport track -showScreen block-starts
          shot 34-highknees -demoData YES -showScreen high-knees
          shot 20-workout -demoData YES -showScreen today
          shot 21-exercise -demoData YES -showScreen skater-bound
          shot 22-exercise2 -demoData YES -showScreen copenhagen-plank
          shot 23-exercise3 -demoData YES -showScreen push-up
          shot 24-exercise4 -demoData YES -showScreen jumping-jacks
          shot 25-calendar -demoData YES -showScreen calendar
          shot 26-routine -demoData YES -showScreen routine
          shot 27-log -demoData YES -showScreen log
          shot 30-player -demoData YES -autoStart YES
          shot 55-howto -demoData YES -showScreen howto
          shot 56-reminders -demoData YES -showScreen reminders
          shot 57-keywords -demoData YES -showScreen keywords
          shot 58-aim-custom -demoData YES -showScreen aimcustom
          shot 59-hill -demoData YES -showScreen hill-jog
          shot 60-hill-player -demoData YES -autoStartExercise hill-jog
          shot 46-diet -demoData YES -showScreen diet
          shot 47-drink -demoData YES -showScreen drink
          shot 48-editfood -demoData YES -showScreen editfood
          shot 49-gps -demoData YES -showScreen gps
          shot 50-track-meet -demoData YES -sport track -showScreen trackmeet
          shot 51-hockey-settings -demoData YES -showScreen hockeysettings
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
