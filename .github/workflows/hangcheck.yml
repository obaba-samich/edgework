name: Hang check

on:
  workflow_dispatch:
    inputs:
      args:
        description: Launch arguments
        default: "-demoData YES -startTab 3"

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Build
        run: |
          brew install xcodegen
          xcodegen generate
          UDID=$(xcrun simctl list devices available | grep -E "^\s+iPhone 16 Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcodebuild -project Edgework.xcodeproj -scheme Edgework -configuration Debug -destination "id=$UDID" -derivedDataPath build build 2>&1 | tail -3
      - name: Launch and sample
        run: |
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Edgework.app
          xcrun simctl launch "$UDID" com.pizza.edgework ${{ inputs.args }}
          sleep 20
          xcrun simctl io "$UDID" screenshot shot.png
          PID=$(pgrep -f "Debug-iphonesimulator/Edgework.app/Edgework" | head -1 || true)
          [ -z "$PID" ] && PID=$(pgrep -x Edgework | head -1)
          echo "pid=$PID"
          ps -o pid,%cpu,etime,command -p $PID || true
          sample $PID 4 -file sample.txt || true
          grep -A60 "Thread_.*DispatchQueue_1: com.apple.main-thread" sample.txt | head -120 || head -150 sample.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hang
          path: |
            shot.png
            sample.txt
